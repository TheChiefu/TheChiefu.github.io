<!DOCTYPE html>
<html>

<head>
    <title>Blog</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/w3.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="scripts/common.js"></script>
</head>
<header>
    <div id="header"></div>
</header>

<body class="w3-light-grey">
    <div class="w3-content w3-margin-top" style="max-width:1400px; min-width: 1000px;">
        <div class="w3-row-padding">
            <div class="blogMain">
                <div class="w3-white w3-card-4 blogContent">
                    <div class="w3-container">
                        <div class="blogTitleBar">
                            <h1 id="title">Blog</h1>
                            <h4 class="w3-tag w3-teal w3-round">All posts</h4>
                        </div>
                        <br />
                        <div id="post-list" class="w3-padding"></div>
                    </div>
                </div>
                <div class="w3-white w3-card-4 blogSidebar">
                    <div id="sidebar"></div>
                </div>
            </div>
        </div>
    </div>
    <footer class="w3-container w3-teal w3-center w3-margin-top">
        <br /><br />
    </footer>

    <script src="scripts/blog-list.js"></script>
</body>

</html>
